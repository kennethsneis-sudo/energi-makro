<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energi og makro</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#E6E8EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Energi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#E6E8EB;
  --surface:#FFFFFF;
  --line:#C3C9D2;
  --line-soft:#DFE3E8;
  --ink:#222B3A;
  --ink-2:#4A566B;
  --muted:#77839A;
  --under:#A8322A;
  --over:#17636B;
  --cho:#B5851B;
  --pro:#35678F;
  --fat:#7A6091;
  --demo:#8A5B00;
  --w-col:1180px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:var(--w-col);margin:0 auto;padding:22px 20px 60px}

/* ---------- topp ---------- */
.top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:23px;font-weight:600;letter-spacing:-.015em;margin:0}
.top .range{color:var(--ink-2);font-size:14px}
.top{margin-bottom:16px}

/* ---------- paneler ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:2px;min-width:0}
.grid-top>*,.grid-bottom>*,.tscroll{min-width:0}
.panel > h2{
  font-size:13px;font-weight:600;color:var(--ink-2);margin:0;
  padding:9px 14px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;
}
.panel > h2 .note{font-weight:400;color:var(--muted);font-size:12px}
.panel > h2 .spacer{margin-left:auto}

.grid-top{display:grid;grid-template-columns:326px 1fr}
.grid-top .daycard{border-right:1px solid var(--line-soft)}
.grid-bottom{display:grid;grid-template-columns:1fr 340px;gap:14px;margin-bottom:14px}

/* ---------- dagskort ---------- */
.daycard{padding:14px 14px 12px}
.balrow{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line-soft)}
.balcell{padding:13px 16px 14px;border-right:1px solid var(--line-soft)}
.balcell:last-child{border-right:0}
.balance .v.sm{font-size:31px}
@media (max-width:1040px){
  .balcell{padding:11px 12px 12px}
  .balance .v{font-size:34px}
  .balance .v.sm{font-size:25px}
  .balcell .dlabel{font-size:11.5px}
  .balance-cap{font-size:11.5px}
}
@media (max-width:620px){
  .balrow{grid-template-columns:1fr}
  .balcell{border-right:0;border-bottom:1px solid var(--line-soft)}
  .balcell:last-child{border-bottom:0}
}
.balance .u.sm{font-size:12.5px;padding-bottom:3px;color:var(--muted)}
.daycard .dlabel{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.balance{display:flex;align-items:flex-end;gap:8px;margin-bottom:2px}
.balance .v{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.balance .u{font-size:14px;color:var(--ink-2);padding-bottom:5px}
.balance-cap{font-size:12.5px;color:var(--ink-2);margin-bottom:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-top:1px solid var(--line-soft);padding-top:9px}
.kv dt{color:var(--ink-2);font-size:13px}
.kv dd{margin:0;text-align:right;font-weight:600;font-size:13.5px}
.kv dd small{font-weight:400;color:var(--muted);font-size:12px;margin-left:5px}

/* ---------- makrobarer ---------- */
.macros{padding:18px 16px 14px}
.mgroup{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
.mgroup:last-of-type{border-bottom:0;padding-bottom:2px;margin-bottom:6px}
.mname{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:9px}
.mrow{display:grid;grid-template-columns:38px 1fr 182px;align-items:center;gap:11px;margin-bottom:9px}
.mrow:last-child{margin-bottom:0}
.mwin{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow.now .mwin{color:var(--ink-2);font-weight:600}
.track{position:relative;height:13px;background:#F1F3F5;border:1px solid var(--line-soft)}
.mrow.now .track{height:21px}
.fill{position:absolute;left:0;top:0;bottom:0;opacity:.55}
.mrow.now .fill{opacity:1}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.mrow.now .tick{top:-4px;bottom:-4px}
.tick::after{
  content:attr(data-l);position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-size:10.5px;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;
}
.mval{font-size:12.5px;text-align:right;color:var(--muted)}
.mrow.now .mval{font-size:13px;color:var(--ink-2)}
.mval b{color:var(--ink-2);font-weight:600}
.mrow.now .mval b{color:var(--ink)}
.mval .gap{margin-left:7px;font-weight:600}
.legend{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:8px;margin-top:12px}

/* ---------- dagsstripe ---------- */
.strip{display:flex;gap:2px;padding:12px 14px 14px;overflow-x:auto;scrollbar-width:thin}
.stripwrap{position:relative}
.stripwrap::before,.stripwrap::after{content:"";position:absolute;top:34px;bottom:1px;width:18px;pointer-events:none}
.stripwrap::before{left:1px;background:linear-gradient(90deg,var(--surface),rgba(255,255,255,0))}
.stripwrap::after{right:1px;background:linear-gradient(270deg,var(--surface),rgba(255,255,255,0))}
.cell{
  flex:1 1 0;min-width:34px;border:1px solid var(--line-soft);background:#FAFBFC;
  padding:5px 3px 4px;text-align:center;cursor:pointer;border-radius:1px;
}
.cell:hover{border-color:var(--muted)}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.cell.sel{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.cell .wd{font-size:10px;color:var(--muted)}
.cell .dd{font-size:12px;font-weight:600}
.cell .bar{height:27px;margin-top:4px;display:flex;flex-direction:column}
.cell .bar .up{height:13px;display:flex;align-items:flex-end}
.cell .bar .mid{height:1px;background:var(--line)}
.cell .bar .dn{height:13px}
.cell .bar b{display:block;width:100%}

/* ---------- segmentert kontroll ---------- */
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{
  font:inherit;font-size:12px;padding:4px 10px;background:#fff;border:0;
  border-right:1px solid var(--line-soft);color:var(--ink-2);cursor:pointer;
}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}

/* ---------- graf ---------- */
.chartbox{padding:10px 14px 6px}
.tgrid{display:grid;gap:10px;padding:0 12px}
.tgrid-2{grid-template-columns:repeat(2,1fr);padding-top:12px;padding-bottom:10px}
.tgrid-3{grid-template-columns:repeat(3,1fr);padding-bottom:12px}
.tcell{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:12px;
  padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.tgrid-3 .tcell{grid-template-columns:86px 1fr;gap:10px}
.tarrow{width:100%;height:58px}
@media (max-width:1100px){
  .tcell{grid-template-columns:96px 1fr;gap:10px;padding:10px 11px}
  .tgrid-3 .tcell{grid-template-columns:62px 1fr;gap:8px}
  .tarrow{height:50px}
  .tdir{font-size:14px}
  .trate{font-size:12.5px}
  .ttot{font-size:11px}
}
@media (max-width:820px){
  .tcell{grid-template-columns:70px 1fr}
  .tgrid-3 .tcell{grid-template-columns:48px 1fr}
  .tgrid{gap:7px;padding:0 8px}
  .tarrow{height:44px}
}
@media (max-width:560px){
  .tgrid-2,.tgrid-3{grid-template-columns:1fr}
}
.tname{font-size:12.5px;color:var(--muted)}
.tdir{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.trate{font-size:13px;font-weight:600;color:var(--ink)}
.ttot{font-size:11.5px;color:var(--muted)}
svg{display:block;width:100%;height:auto}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);padding:0 14px 12px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:16px;height:0;border-top-width:2px;border-top-style:solid}
.swatch.block{height:10px;border:0}

/* ---------- tabeller ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:11.5px}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-bottom:0;padding-top:8px}
tbody tr.cur td{background:#F4F6F8;font-weight:600}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- rullerende ---------- */
.rollhead{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:9px 14px 6px;font-size:11.5px;color:var(--muted)}
.rollhead span:not(:first-child){text-align:right;min-width:62px}
.rollrow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:6px 14px;border-top:1px solid var(--line-soft);font-size:13px}
.rollrow span:not(:first-child){text-align:right;min-width:62px;font-variant-numeric:tabular-nums}
.rollrow .d{font-weight:600}

/* ---------- fotpaneler ---------- */

@media (max-width:960px){
  .grid-top,.grid-bottom{grid-template-columns:1fr}
  .grid-top .daycard{border-right:0;border-bottom:1px solid var(--line-soft)}
  .mrow{grid-template-columns:34px 1fr;grid-template-areas:"w b" ". v";row-gap:3px}
  .mrow .mwin{grid-area:w}.mrow .track{grid-area:b}.mrow .mval{grid-area:v;text-align:left}
}

/* ---------- mobil ---------- */
@media (max-width:620px){
  .balrow{grid-template-columns:1fr 1fr;grid-template-areas:"dag dag" "w7 w21"}
  .balcell:nth-child(1){grid-area:dag;border-bottom:1px solid var(--line-soft);border-right:0}
  .balcell:nth-child(2){grid-area:w7;border-right:1px solid var(--line-soft)}
  .balcell:nth-child(3){grid-area:w21}
  .balance .v{font-size:38px}
  .balance .v.sm{font-size:22px}
  .balance .u.sm{font-size:11px}
}
@media (max-width:520px){
  .wrap{padding:14px 10px 40px}
  .top h1{font-size:20px}
  .sub{font-size:11.5px;margin-bottom:12px}
  .panel > h2{padding:8px 11px;font-size:12.5px;flex-wrap:wrap;gap:6px}
  .panel > h2 .note{font-size:11px}
  .strip{padding:10px 8px;gap:3px;scroll-snap-type:x proximity}
  .cell{min-width:40px;scroll-snap-align:center}
  .daycard{padding:11px}
  .kv dt,.kv dd{font-size:12.5px}
  .macros{padding:14px 11px 12px}
  .mrow{grid-template-columns:30px 1fr;row-gap:2px;margin-bottom:7px}
  .mgroup{margin-bottom:10px;padding-bottom:8px}
  .mval{font-size:12px}
  .mrow.now .mval{font-size:12.5px}
  .tick::after{font-size:10px;top:-14px}
  .tcell{grid-template-columns:56px 1fr;gap:9px;padding:9px 10px}
  .tgrid-3 .tcell{grid-template-columns:56px 1fr}
  .tarrow{height:38px}
  .tdir{font-size:14px}
  .trate{font-size:12.5px}
  .ttot{font-size:11px}
  th,td{padding:5px 7px;font-size:11.5px}
  th:first-child,td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;
    box-shadow:1px 0 0 var(--line-soft)}
  tbody tr.cur td:first-child{background:#F4F6F8}
  tfoot td:first-child{background:var(--surface)}
  .rollrow,.rollhead{padding-left:11px;padding-right:11px}
  .chart-legend{padding:0 11px 10px;font-size:11px;gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    <section class="panel">

    <section class="panel">

      <div class="rollhead"><span></span><span>7 d</span><span>21 d</span><span>diff</span></div>
      <div id="rollRows"></div>
    </section>
  </div>



</div>

/* ---------- hjelpere ---------- */
const NB = "\u00A0";
const nf = (v,d=0)=> v==null || Number.isNaN(v) ? "–"
  : v.toLocaleString("nb-NO",{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = (v,d=0)=> v==null ? "–" : (v>0?"+":v<0?"\u2212":"") + nf(Math.abs(v),d);
const WD = ["søn","man","tir","ons","tor","fre","lør"];
const dObj = s => new Date(s+"T00:00:00Z");
const fmtDay = s => { const d=dObj(s); return WD[d.getUTCDay()]+" "+d.getUTCDate()+"."+(d.getUTCMonth()+1)+"."; };
const fmtShort = s => { const d=dObj(s); return d.getUTCDate()+"."+(d.getUTCMonth()+1)+"."; };

function rolling(arr, win, pick){
  const MINW = Math.ceil(win*0.6);          // delvis vindu godtas ned til 60 % dekning
  return arr.map((_,i)=>{
    if(i < MINW-1) return null;
    const v = [];
    for(let k=Math.max(0,i-win+1);k<=i;k++){ const x = pick(arr[k]); if(x!=null) v.push(x); }
    return v.length < MINW ? null : v.reduce((a,b)=>a+b,0)/v.length;
  });
}
function isoWeek(s){
  const d = dObj(s); const day = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-day+3);
  const first = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const w = 1 + Math.round(((d-first)/86400000 - 3 + ((first.getUTCDay()+6)%7))/7);
  return d.getUTCFullYear()+"-"+String(w).padStart(2,"0");
}
/* Dager uten registrert inntak har kcalIn/makro = null. Avvik mot behov regnes bare når
   begge finnes — ellers blir en tom dag lest som et underskudd på hele behovet. */
const diff = (v, n) => v==null || n==null ? null : v-n;
const balOf = d => diff(d.kcalIn, d.kcalNeed);
const harInntak = d => d.kcalIn != null;

function renderDay(){
  const d = DAYS[selected];
  const bal = balOf(d);
  document.getElementById("dayDate").textContent = fmtDay(d.date);
  const bv = document.getElementById("balVal");
  bv.textContent = sgn(bal);
  bv.style.color = bal==null ? "var(--muted)" : bal < 0 ? "var(--under)" : "var(--over)";
  document.getElementById("balCap").textContent =
    bal==null ? "inntak ikke registrert" : bal < 0 ? "under behov" : "over behov";
  document.getElementById("kIn").innerHTML = d.kcalIn==null
    ? "– <small>ikke registrert</small>" : nf(d.kcalIn)+" <small>kcal</small>";
  document.getElementById("kNeed").innerHTML = nf(d.kcalNeed)+" <small>kcal</small>";
  document.getElementById("kTrain").innerHTML = nf(d.trainKcal)+" <small>kcal</small>";
  document.getElementById("kWeight").innerHTML = d.weight==null
    ? "– <small>ikke målt</small>" : nf(d.weight,1)+" <small>kg</small>";
  renderWeeks();
  renderWindow(7,  "r7Label",  "bal7",  "bal7cap");
  renderWindow(21, "r21Label", "bal21", "bal21cap");
  renderMacros(d);
  document.querySelectorAll(".cell").forEach((c,i)=>c.classList.toggle("sel", i===selected-Math.max(0,DAYS.length-21)));
}

function renderWindow(win, idLabel, idVal, idCap){
  const from = Math.max(0, selected-win+1);
  const nDays = selected+1-from, part = nDays < win;
  const win_ = DAYS.slice(from, selected+1).filter(harInntak);
  const nReg = win_.length;
  document.getElementById(idLabel).textContent = win+" dager · "
    + fmtShort(DAYS[from].date)+"–"+fmtShort(DAYS[selected].date)
    + (nReg < nDays ? " ("+nReg+" reg.)" : part ? " ("+nDays+" d)" : "");
  const el = document.getElementById(idVal), cap = document.getElementById(idCap);
  if(nReg < Math.ceil(win*0.6)){ el.textContent = "–"; el.style.color="var(--muted)";
    cap.textContent = nDays < Math.ceil(win*0.6) ? "for lite historikk" : "for få registrerte dager";
    cap.style.color="var(--muted)"; return; }
  const sum = win_.reduce((a,b)=>a+balOf(b),0);
  const need = win_.reduce((a,b)=>a+b.kcalNeed,0);
  const avg = sum/nReg;
  const pct = need ? sum/need*100 : null;
  el.textContent = sgn(avg);
  el.style.color = avg<0 ? "var(--under)" : "var(--over)";
  cap.innerHTML = `<span style="color:${sum<0?"var(--under)":"var(--over)"};font-weight:600">${sgn(pct,1)} %</span>
    <span style="color:var(--muted)">av behov · ${sum<0?"underskudd":"overskudd"}</span>`;
}

function winMean(win, f, bare){
  const from = Math.max(0, selected-win+1);
  if(selected+1-from < Math.ceil(win*0.6)) return null;
  // bare: snitt kun over dager der den målte verdien finnes, så inntak og behov sammenlignes på samme dager
  const a = DAYS.slice(from, selected+1).filter(d=>!bare || bare(d)!=null).map(f).filter(v=>v!=null);
  return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
}

function renderMacros(d){
  const REF = 70; // behovet ligger alltid her, slik at radene leses mot samme referanse
  const macros = [
    {k:"Karbohydrat", c:"var(--cho)", v:x=>x.cho, n:x=>x.choNeed},
    {k:"Protein",     c:"var(--pro)", v:x=>x.pro, n:x=>x.proNeed},
    {k:"Fett",        c:"var(--fat)", v:x=>x.fat, n:x=>x.fatNeed}
  ];
  const wins = [
    {lab:"Dag",  now:true,  v:m=>m.v(d),          n:m=>m.n(d),          w:()=>d.weight},
    {lab:"7 d",  now:false, v:m=>winMean(7,m.v),  n:m=>winMean(7,m.n,m.v),  w:()=>winMean(7,x=>x.weight)},
    {lab:"21 d", now:false, v:m=>winMean(21,m.v), n:m=>winMean(21,m.n,m.v), w:()=>winMean(21,x=>x.weight)}
  ];
  // choNeed per kg over det tarmen kan ta opp: dagen leses som «kan ikke fôres fullt», ikke som bom
  const kgDag = d.weight ?? winMean(7, x=>x.weight);
  const ikkeForbar = VIS_IKKE_FORBAR && kgDag!=null && d.choNeed/kgDag > IKKE_FORBAR_GKG;
  document.getElementById("macroBars").innerHTML = macros.map(m=>`
    <div class="mgroup">
      <div class="mname">${m.k}${ikkeForbar && m.k==="Karbohydrat"
        ? ` <span style="font-weight:400;color:var(--muted)">· kan ikke fôres fullt</span>` : ""}</div>
      ${wins.map(win=>{
        const v = win.v(m), n = win.n(m), w = win.w();
        if(v==null || n==null) return `<div class="mrow${win.now?" now":""}">
          <span class="mwin">${win.lab}</span>
          <span class="track"><i class="tick" style="left:${REF}%"></i></span>
          <span class="mval">${win.now?"ikke registrert":"for lite historikk"}</span></div>`;
        const gap = v-n;
        const gapCol = win.now && ikkeForbar && m.k==="Karbohydrat" && gap<0 ? "var(--muted)"
          : gap<0 ? "var(--under)" : "var(--over)";
        return `<div class="mrow${win.now?" now":""}">
          <span class="mwin">${win.lab}</span>
          <span class="track">
            <i class="fill" style="width:${Math.min(100, v/n*REF).toFixed(1)}%;background:${m.c}"></i>
            <i class="tick" style="left:${REF}%" ${win.now?`data-l="${nf(n)}${NB}g"`:""}></i>
          </span>
          <span class="mval num"><b>${nf(v)}</b>${NB}g${w?" · "+nf(v/w,1)+NB+"g/kg":""}
            <span class="gap" style="color:${gapCol}">${sgn(gap)}</span></span>
        </div>`;
      }).join("")}
    </div>`).join("") ;
}

/* ---------- trend: retning siste 21 dager ---------- */
/* To ting avgjør konklusjonen: stigningen (minste kvadraters regresjon på de daglige verdiene)
   OG hvor godt den skiller seg fra støyen. En drift som forsvinner i dag-til-dag-variasjonen
   meldes som "ingen tydelig retning", uansett hvor stor den ser ut i absolutte tall.
   Karbo, protein og fett måles ikke som nivå, men som avvik mot dagens behov — behovet
   flytter seg med treningsbelastningen, så et stabilt inntak kan være en fallende trend. */
const TSERIES = [
  {label:"Energibalanse", sub:"inntak mot behov", unit:"kcal", dec:0, col:"#2F3A4B", min:15,
   val:balOf,                          avvik:true},
  {label:"Karbohydrat",   sub:"avvik mot behov",  unit:"g",    dec:0, col:"#B5851B", min:3,
   val:d=>diff(d.cho,d.choNeed),       avvik:true},
  {label:"Protein",       sub:"avvik mot behov",  unit:"g",    dec:0, col:"#35678F", min:1.5,
   val:d=>diff(d.pro,d.proNeed),       avvik:true},
  {label:"Fett",          sub:"avvik mot behov",  unit:"g",    dec:0, col:"#7A6091", min:1,
   val:d=>diff(d.fat,d.fatNeed),       avvik:true},
  {label:"Vekt",          sub:"nivå",             unit:"kg",   dec:2, col:"#2F3A4B", min:0.015,
   val:d=>d.weight, uke:true}
];
const TWIN = 21;     // vindu for retningen
const TMIN = 2.0;    // |t| under dette: stigningen skilles ikke fra støyen
/* Hver serie har sin egen terskel for hva som er en endring verdt å melde (min, per dag).
   En felles prosentregel gjør ikke nytten: 3 % av vekta er 2,2 kg, 3 % av treningstida er 6 min.
   Tallene under er satt av meg og skal justeres når vi ser hvor mye de ekte dataene svinger. */

function fitLine(pts){
  const n = pts.length;
  if(n < 5) return null;
  const mx = pts.reduce((a,p)=>a+p[0],0)/n, my = pts.reduce((a,p)=>a+p[1],0)/n;
  let sxy=0, sxx=0;
  pts.forEach(([px,py])=>{ sxy += (px-mx)*(py-my); sxx += (px-mx)**2; });
  if(!sxx) return null;
  const k = sxy/sxx, m = my-k*mx;
  let sse=0;
  pts.forEach(([px,py])=>{ sse += (py-(k*px+m))**2; });
  const se = Math.sqrt(sse/(n-2)/sxx);           // standardfeil for stigningen
  return {k, mean:my, t: se ? k/se : 0};
}

function renderChart(){
  const from = Math.max(0, selected-TWIN+1);
  const win = DAYS.slice(from, selected+1);
  document.getElementById("trendNote").textContent =
    fmtShort(DAYS[from].date)+"–"+fmtShort(DAYS[selected].date)
    + (win.length<TWIN ? " ("+win.length+" av "+TWIN+" dager)" : "");

  const cellFor = s => {
    const pts = win.map((d,i)=>[i, s.val(d)]).filter(p=>p[1]!=null);
    const f = pts.length>=Math.ceil(TWIN*0.6) ? fitLine(pts) : null;

    const over  = f ? f.k*(TWIN-1) : null;
    const small = !f || Math.abs(f.k) < s.min;          // under terskel for å melde noe
    const noisy = !!f && !small && Math.abs(f.t) < TMIN; // stor nok, men drukner i variasjonen
    const flat  = !f || small;

    const deg = flat ? 0 : Math.max(-34, Math.min(34, f.k/s.min*12));
    const dir = !f ? "Ikke nok data"
      : small ? "Stabil"
      : noisy ? (f.k>0 ? "Mulig stigning" : "Mulig fall")
      : (f.k>0 ? "Stigende trend" : "Synkende trend");
    const col = !f ? "var(--muted)" : small ? "#96A0AE" : noisy ? "#7E8899" : s.col;

    const fmtR = (v,d)=>{ const t=sgn(v,d); return /^[+\u2212]0(,0+)?$/.test(t) ? t.slice(1) : t; };
    const dd = v => s.dec>0 ? s.dec : (Math.abs(v)<1 ? 1 : 0);
    const rate = !f ? "–"
      : fmtR(f.k, dd(f.k))+" "+s.unit+"/dag"
        + (s.uke ? " · "+fmtR(f.k*7,1)+" "+s.unit+"/uke" : "");
    const tot = !f ? "" : fmtR(over, dd(over))+" "+s.unit+" over "+TWIN+" dager"
      + (s.avvik ? " · snitt "+fmtR(f.mean, dd(f.mean))+" "+s.unit+" mot behov" : "")
      + (noisy ? " · svinger mye, retningen er usikker" : "");

    return `<div class="tcell">
      ${arrowSVG(deg, col, flat, noisy)}
      <div class="ttext">
        <div class="tname">${s.label} <span style="color:#A9B2BE">· ${s.sub}</span></div>
        <div class="tdir" style="color:${col}">${dir}</div>
        <div class="trate num">${rate}</div>
        <div class="ttot num">${tot}</div>
      </div>
    </div>`;
  };
  const by = n => TSERIES.find(s=>s.label===n);
  document.getElementById("trendTop").innerHTML =
    [by("Energibalanse"), by("Vekt")].map(cellFor).join("");
  document.getElementById("trendBottom").innerHTML =
    [by("Karbohydrat"), by("Protein"), by("Fett")].map(cellFor).join("");
}

function arrowSVG(deg, col, flat, noisy){
  const a = deg*Math.PI/180;
  const x1=6, x2=112, cy=31, d=(x2-x1)/2*Math.tan(a);
  const y1=cy+d, y2=cy-d;
  const ang = Math.atan2(y2-y1, x2-x1);
  const head = (o)=>[ (x2-15*Math.cos(ang-o)).toFixed(1), (y2-15*Math.sin(ang-o)).toFixed(1) ].join(",");
  return `<svg class="tarrow" viewBox="0 0 120 62" aria-hidden="true">
    <line x1="${x1}" y1="${y1.toFixed(1)}" x2="${(x2-7).toFixed(1)}" y2="${(y2+7*Math.tan(a)).toFixed(1)}"
      stroke="${col}" stroke-width="${flat?4:5}" stroke-linecap="butt" ${noisy?'stroke-dasharray="7 4"':""}/>
    <polygon points="${x2},${y2.toFixed(1)} ${head(0.42)} ${head(-0.42)}" fill="${col}"/>
  </svg>`;
}

/* ---------- uketabell ---------- */
const perKg=(v,kg)=> v==null ? null : v/kg;

function wmean(rows,key){ const v=rows.map(r=>r[key]).filter(x=>x!=null&&!Number.isNaN(x));
  return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; }

function renderWeeks(){
  const map = new Map();
  DAYS.forEach(d=>{ const k=isoWeek(d.date); if(!map.has(k)) map.set(k,[]); map.get(k).push(d); });
  const all = [...map.entries()];
  const rowsAll = all.map(([k,ds],idx)=>{
    const n = ds.length;
    const s = f => ds.reduce((a,b)=>a+(f(b)||0),0);
    const avg = f => { const v=ds.map(f).filter(x=>x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
    const wts = ds.map(d=>d.weight).filter(v=>v!=null);
    const wAvg = wts.length ? wts.reduce((a,b)=>a+b,0)/wts.length : null;
    const prev = idx>0 ? (()=>{ const p=all[idx-1][1].map(d=>d.weight).filter(v=>v!=null);
      return p.length ? p.reduce((a,b)=>a+b,0)/p.length : null; })() : null;
    const kgRef = wAvg || 74;
    // inntak, behov og balanse bare over dager med registrert inntak
    const reg = ds.filter(harInntak), nReg = reg.length;
    const sR = f => reg.reduce((a,b)=>a+f(b),0);
    return {
      uke: k.slice(5), dager:n, reg:nReg, kcalIn:sR(d=>d.kcalIn), kcalNeed:sR(d=>d.kcalNeed), min:s(d=>d.trainMin),
      inn: nReg ? sR(d=>d.kcalIn)/nReg : null, behov: nReg ? sR(d=>d.kcalNeed)/nReg : null, bal: nReg ? sR(balOf) : null,
      cho: perKg(avg(d=>d.cho),kgRef), pro: perKg(avg(d=>d.pro),kgRef), fat: perKg(avg(d=>d.fat),kgRef),
      tim: s(d=>d.trainMin)/60, vekt:wAvg, dv: (wAvg!=null&&prev!=null)? wAvg-prev : null
    };
  });
  // vinduet: uka valgt dato ligger i, pluss fem uker bakover — nyeste først
  const selWeek = isoWeek(DAYS[selected].date);
  const selIdx = all.findIndex(([k])=>k===selWeek);
  const win = rowsAll.slice(Math.max(0, selIdx-5), selIdx+1);
  const days = win.reduce((a,r)=>a+r.dager,0), regDays = win.reduce((a,r)=>a+r.reg,0);
  const balSum = regDays ? win.reduce((a,r)=>a+(r.bal||0),0) : null;
  const balCol = v => v==null ? "var(--muted)" : v<0 ? "var(--under)" : "var(--over)";
  const dagTekst = (reg,n) => reg<n ? reg+"/"+n : String(n);
  const rows = win.slice().reverse();
  document.getElementById("weekTable").innerHTML = `
    <thead><tr><th>Uke</th><th>Dager</th><th>Trening</th><th>Inn</th><th>Behov</th><th>Balanse</th>
      <th>KH</th><th>Prot</th><th>Fett</th><th>Vekt</th><th>Δ vekt</th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr class="${i===0?"cur":""}">
      <td class="num">${r.uke}</td><td class="num">${dagTekst(r.reg,r.dager)}</td><td class="num">${nf(r.tim,1)} t</td>
      <td class="num">${nf(r.inn)}</td><td class="num">${nf(r.behov)}</td>
      <td class="num" style="color:${balCol(r.bal)}">${sgn(r.bal)}</td>
      <td class="num">${nf(r.cho,1)}</td><td class="num">${nf(r.pro,1)}</td><td class="num">${nf(r.fat,2)}</td>
      <td class="num">${nf(r.vekt,1)}</td><td class="num">${sgn(r.dv,1)}</td>
    </tr>`).join("")}</tbody>
    <tfoot><tr style="border-top:1px solid var(--line)">
      <td>${win.length} uker samlet</td><td class="num">${dagTekst(regDays,days)}</td>
      <td class="num">${nf(win.reduce((a,r)=>a+r.min,0)/60,1)} t</td>
      <td class="num">${regDays ? nf(win.reduce((a,r)=>a+r.kcalIn,0)/regDays) : "–"}</td>
      <td class="num">${regDays ? nf(win.reduce((a,r)=>a+r.kcalNeed,0)/regDays) : "–"}</td>
      <td class="num" style="color:${balCol(balSum)}">${sgn(balSum)}</td>
      <td class="num">${nf(wmean(win,"cho"),1)}</td>
      <td class="num">${nf(wmean(win,"pro"),1)}</td>
      <td class="num">${nf(wmean(win,"fat"),2)}</td>
      <td class="num">${nf(win.at(-1).vekt,1)}</td>
      <td class="num">${(win.at(-1).vekt!=null&&win[0].vekt!=null)?sgn(win.at(-1).vekt-win[0].vekt,1):"–"}</td>
    </tr></tfoot>`;
}

/* ---------- rullerende panel ---------- */
function renderRolling(){
  const last = a => { for(let i=a.length-1;i>=0;i--) if(a[i]!=null) return a[i]; return null; };
  const defs = [
    ["Inntak","kcal", d=>d.kcalIn, 0],
    ["Behov","kcal", d=>harInntak(d)?d.kcalNeed:null, 0],
    ["Balanse","kcal", d=>balOf(d), 0],
    ["Karbohydrat","g/kg", d=>d.weight&&d.cho!=null?d.cho/d.weight:null, 1],
    ["Protein","g/kg", d=>d.weight&&d.pro!=null?d.pro/d.weight:null, 1],
    ["Fett","g/kg", d=>d.weight&&d.fat!=null?d.fat/d.weight:null, 2],
    ["Vekt","kg", d=>d.weight, 1],
    ["Treningstid","t/uke", d=>d.trainMin/60*7, 1]
  ];
  document.getElementById("rollRows").innerHTML = defs.map(([n,u,f,dec])=>{
    const a = last(rolling(DAYS,7,f)), b = last(rolling(DAYS,21,f));
    const dd = diff(a, b);
    const col = dd==null ? "var(--muted)" : (n==="Balanse"||n==="Inntak"||n==="Karbohydrat")
      ? (dd<0?"var(--under)":"var(--over)") : "var(--ink-2)";
    return `<div class="rollrow"><span class="d">${n} <span style="color:var(--muted);font-size:11.5px">${u}</span></span>
      <span>${nf(a,dec)}</span><span>${nf(b,dec)}</span>
      <span style="color:${col}">${sgn(dd,dec)}</span></div>`;
  }).join("");
}

renderStrip(); renderDay(); renderChart(); renderRolling();
(function scrollToSelected(){
  const c = document.querySelectorAll(".cell")[selected-Math.max(0,DAYS.length-21)];
  if(c) c.scrollIntoView({block:"nearest", inline:"end"});
})();
if("serviceWorker" in navigator){ navigator.serviceWorker.register("./sw.js").catch(()=>{}); }
